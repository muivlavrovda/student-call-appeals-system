[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    core
    users
addopts =
    --strict-markers
    --reuse-db
    --cov
    --cov-report=term-missing
    --cov-report=xml
markers =
    unit: isolated model, manager, helper, or utility tests
    integration: tests that combine Django components and the database
    functional: user-visible feature behavior
    smoke: quick checks that the application boots and core pages respond
    security: authentication and authorization boundaries
filterwarnings =
    ignore::DeprecationWarning
    ignore:No directory at:UserWarning
